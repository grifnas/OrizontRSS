name: Verificare Orizont RSS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Descarcă sursa
        uses: actions/checkout@v4
      - name: Configurează .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verificare comună completă (aceeași ca local)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\verify-source.ps1 -Mode Full
